# Docker Compose override for E2E testing
# Starts the full stack with test-specific config
version: "3.8"

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_USER: livestockguard
      POSTGRES_PASSWORD: livestockguard_dev
      POSTGRES_DB: livestockguard
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livestockguard"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  emqx:
    image: emqx/emqx:5.4
    ports:
      - "1883:1883"
      - "18083:18083"
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
