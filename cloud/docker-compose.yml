services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: livestockguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-livestockguard_dev}
      POSTGRES_DB: livestockguard
    volumes:
      - pgdata:/home/postgres/pgdata/data
      - ./migrations/versions:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livestockguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  emqx:
    image: emqx/emqx:5.5
    ports:
      - "1883:1883"
      - "8883:8883"
      - "18083:18083"
    environment:
      EMQX_NAME: livestockguard
      EMQX_HOST: 127.0.0.1
    volumes:
      - emqxdata:/opt/emqx/data

  api_gateway:
    build:
      context: .
      dockerfile: services/api_gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://livestockguard:${POSTGRES_PASSWORD:-livestockguard_dev}@postgres:5432/livestockguard
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_in_production}
      MQTT_HOST: emqx
      MQTT_PORT: 1883
      # macOS bind mounts don't forward inotify events into the Linux VM, so
      # WatchFiles must poll for changes to detect edits reliably.
      WATCHFILES_FORCE_POLLING: "true"
    # Dev hot-reload: mount source over the baked-in copies and enable --reload
    # so code edits take effect without rebuilding the image. The Dockerfile
    # still bakes the source in for production (where these mounts are absent).
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app", "--reload-dir", "/app/livestockguard_common"]
    volumes:
      - ./services/api_gateway/app:/app/app
      - ./shared/livestockguard_common:/app/livestockguard_common
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mqtt_writer:
    build:
      context: .
      dockerfile: services/mqtt_writer/Dockerfile
    environment:
      MQTT_BROKER: emqx
      MQTT_PORT: 1883
      DATABASE_URL: postgresql://livestockguard:${POSTGRES_PASSWORD:-livestockguard_dev}@postgres:5432/livestockguard
      REDIS_URL: redis://redis:6379/0
      # macOS bind mounts don't forward inotify events into the Linux VM, so
      # watchfiles must poll to detect edits reliably.
      WATCHFILES_FORCE_POLLING: "true"
    # Dev hot-reload: watchfiles restarts the process when the mounted source
    # changes. This is a plain (non-uvicorn) worker, so we wrap it with the
    # watchfiles CLI rather than using --reload. The Dockerfile still bakes the
    # source in for production (where these mounts and command are absent).
    command: ["watchfiles", "python mqtt_writer.py", "/app/mqtt_writer.py", "/app/livestockguard_common"]
    volumes:
      - ./services/mqtt_writer/mqtt_writer.py:/app/mqtt_writer.py
      - ./shared/livestockguard_common:/app/livestockguard_common
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_started

  alert_engine:
    build:
      context: .
      dockerfile: services/alert_engine/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      AWS_REGION: af-south-1
      SES_SENDER_EMAIL: ${SES_SENDER_EMAIL:-alerts@livestockguard.co.za}
      ALERT_EMAIL_RECIPIENTS: ${ALERT_EMAIL_RECIPIENTS:-}
      FIREBASE_CREDENTIALS_PATH: /app/config/firebase-credentials.json
      WEBHOOK_URLS: ${WEBHOOK_URLS:-}
      # macOS bind mounts don't forward inotify events into the Linux VM, so
      # watchfiles must poll to detect edits reliably.
      WATCHFILES_FORCE_POLLING: "true"
    # Dev hot-reload: watchfiles restarts the worker when the mounted source
    # changes. The Dockerfile still bakes the source in for production.
    command: ["watchfiles", "python -m app.main", "/app/app", "/app/livestockguard_common"]
    volumes:
      - ${FIREBASE_CREDENTIALS_FILE:-./config/firebase-credentials.json}:/app/config/firebase-credentials.json:ro
      - ./services/alert_engine/app:/app/app
      - ./shared/livestockguard_common:/app/livestockguard_common
    depends_on:
      redis:
        condition: service_healthy

  analytics_engine:
    build:
      context: services/analytics_engine
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://livestockguard:${POSTGRES_PASSWORD:-livestockguard_dev}@postgres:5432/livestockguard
      REDIS_URL: redis://redis:6379/0
      RUN_ON_STARTUP: "true"
      BASELINE_WINDOW_DAYS: "7"
      ANOMALY_CHECK_INTERVAL_HOURS: "2"
      DAILY_REPORT_HOUR: "18"
      REDUCED_MOVEMENT_Z_THRESHOLD: "-2.0"
      ISOLATION_HOURS_THRESHOLD: "4"
      PATROL_GAP_DAYS_THRESHOLD: "3"
      MISSING_ALERT_CHECK_INTERVAL_MINUTES: "15"
      MISSING_ALERT_THRESHOLD_HOURS: "6"
      MISSING_ALERT_SEVERITY: "critical"
      MISSING_ALERT_ON_NEVER_SEEN: "false"
      # macOS bind mounts don't forward inotify events into the Linux VM, so
      # watchfiles must poll to detect edits reliably.
      WATCHFILES_FORCE_POLLING: "true"
    # Dev hot-reload: watchfiles restarts the scheduler when the mounted source
    # changes. This service vendors only its own app/ (no livestockguard_common).
    # The Dockerfile still bakes the source in for production.
    command: ["watchfiles", "python -m app.main", "/app/app"]
    volumes:
      - ./services/analytics_engine/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  herding_orchestrator:
    build:
      context: services/herding_orchestrator
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://livestockguard:${POSTGRES_PASSWORD:-livestockguard_dev}@postgres:5432/livestockguard
      REDIS_URL: redis://redis:6379/0
      MQTT_HOST: emqx
      MQTT_PORT: 1883
      HERDING_DEFAULT_MODE: ${HERDING_DEFAULT_MODE:-auto}
      HERDING_LOOP_INTERVAL_SEC: "3.0"
      HERDING_DEFAULT_BUFFER_M: "15.0"
      HERDING_MIN_BATTERY_FOR_JOB_PCT: "20"
      RUN_ON_STARTUP: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  emqxdata:
