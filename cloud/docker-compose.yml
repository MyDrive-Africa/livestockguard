services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: livestockguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-livestockguard_dev}
      POSTGRES_DB: livestockguard
    volumes:
      - pgdata:/home/postgres/pgdata/data
      - ./migrations/versions:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livestockguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  emqx:
    image: emqx/emqx:5.5
    ports:
      - "1883:1883"
      - "8883:8883"
      - "18083:18083"
    environment:
      EMQX_NAME: livestockguard
      EMQX_HOST: 127.0.0.1
    volumes:
      - emqxdata:/opt/emqx/data

  api_gateway:
    build:
      context: .
      dockerfile: services/api_gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://livestockguard:${POSTGRES_PASSWORD:-livestockguard_dev}@postgres:5432/livestockguard
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_in_production}
      MQTT_HOST: emqx
      MQTT_PORT: 1883
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mqtt_writer:
    build:
      context: services/mqtt_writer
      dockerfile: Dockerfile
    environment:
      MQTT_BROKER: emqx
      MQTT_PORT: 1883
      DATABASE_URL: postgresql://livestockguard:${POSTGRES_PASSWORD:-livestockguard_dev}@postgres:5432/livestockguard
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_started

  alert_engine:
    build:
      context: services/alert_engine
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      AWS_REGION: af-south-1
      SES_SENDER_EMAIL: ${SES_SENDER_EMAIL:-alerts@livestockguard.co.za}
      ALERT_EMAIL_RECIPIENTS: ${ALERT_EMAIL_RECIPIENTS:-}
      FIREBASE_CREDENTIALS_PATH: /app/config/firebase-credentials.json
      WEBHOOK_URLS: ${WEBHOOK_URLS:-}
    volumes:
      - ${FIREBASE_CREDENTIALS_FILE:-./config/firebase-credentials.json}:/app/config/firebase-credentials.json:ro
    depends_on:
      redis:
        condition: service_healthy

  analytics_engine:
    build:
      context: services/analytics_engine
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://livestockguard:${POSTGRES_PASSWORD:-livestockguard_dev}@postgres:5432/livestockguard
      RUN_ON_STARTUP: "true"
      BASELINE_WINDOW_DAYS: "7"
      ANOMALY_CHECK_INTERVAL_HOURS: "2"
      DAILY_REPORT_HOUR: "18"
      REDUCED_MOVEMENT_Z_THRESHOLD: "-2.0"
      ISOLATION_HOURS_THRESHOLD: "4"
      PATROL_GAP_DAYS_THRESHOLD: "3"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  emqxdata:
