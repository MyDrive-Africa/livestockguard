[package]
name = "livestockguard-ingestion"
version = "0.1.0"
edition = "2021"
description = "Telemetry ingestion service for LivestockGuard"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
rumqttc = "0.24"
